services:
  ai-engine:
    build: ./ai-engine
    env_file:
      - ./ai-engine/.env
    volumes:
      - chroma-model-cache:/root/.cache/chroma/onnx_models

  backend:
    build: ./backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      AI_ENGINE_URL: http://ai-engine:7860
    depends_on:
      - ai-engine

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001
    ports:
      - "8080:80"

volumes:
  chroma-model-cache: